name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLUTION: LiquiLabs.Vankoo.Invoicing.sln
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint:
    name: Lint (dotnet format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $SOLUTION

      - name: Verify formatting and code style
        run: dotnet format $SOLUTION --verify-no-changes --no-restore --severity warn --verbosity diagnostic

  build-test:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $SOLUTION

      - name: Build
        run: dotnet build $SOLUTION --configuration Release --no-restore -warnaserror -p:WarningsNotAsErrors=NU1903

      - name: Unit and acceptance tests with coverage
        run: >
          dotnet test $SOLUTION
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: Html;MarkdownSummaryGithub;TextSummary
          assemblyfilters: -*.Tests

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage-report/SummaryGithub.md ]; then
            cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            TestResults/**/*.trx
            coverage-report/
          retention-days: 14

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history for blame and new-code detection

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin analysis
        run: >
          dotnet sonarscanner begin
          /k:"liquilabshq_vankoo-invoicing-service"
          /o:"liquilabshq"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="**/*.feature.cs,**/Program.cs"
          /d:sonar.exclusions="**/*.feature.cs,**/bin/**,**/obj/**"

      - name: Build
        run: dotnet build $SOLUTION --configuration Release

      - name: Test (opencover for Sonar)
        run: >
          dotnet test $SOLUTION
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End analysis
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
